 ####---------- Environment Tab Localization ----------####
 com_intro_window_environment_tab_button: "@com_maplist_btn! Environment"
 com_intro_window_region_header: "Environs of [GetPlayer.GetCapital.GetStateRegion.GetStrategicRegion.GetNameNoFormatting]"
 com_intro_window_region_body: "[GetPlayer.GetCustom('com_intro_window_macroregion_type')][GetPlayer.GetCustom('com_intro_window_subregion_type')][GetPlayer.GetCustom('com_intro_window_rank_type')]$com_intro_window_government_summary$"

 com_intro_window_macroregion_europe: "Europe finds itself in the midst of a various economic and social transformations. Industry has been revolutionized by the spread of steam-powered production, improving metallurgy, and increasing mechanization. Society grapples with explosive population growth and emerging class consciousness as peasants are drawn from their ancestral villages towards urban centers."
 com_intro_window_macroregion_americas: "The Americas are undergoing a rapid transformation. The influence of the burgeoning United States has seen the collapse of the New World Empires with the increasingly autonomous Canada and small territories along the Caribbean being the last outposts of direct European control. The new nations grapple with both their identities and the question of what to do with the countless Indigenous Americans who show little interest in cooperating with these new states."
 com_intro_window_macroregion_mena: "The Middle East and the Maghreb are increasingly in disarray. The ongoing stagnation of the Ottoman Empire has opened power vacuums across the Mediterranean while the Guarded Domains of Iran buckle under pressure from Russian expansion. As the Eastern Question and Great Game take root in European thought, the Great Powers seek to reduce Western Asia to little more than colonial outposts of their growing empires."
 com_intro_window_macroregion_asia: "Eastern Asian lingers in the growing shadow of European imperialism. The Qing dynasty, long the hegemon in the East, finds itself challenged by European interlopers. Japan remains closed outsiders while the Indian subcontinent and the islands of Indonesia have been carved up among colonial powers. In Central Asia, the Great Game has fractured the balance of power as Russia and Great Britain compete for dominance."
 com_intro_window_macroregion_africa: "#todo com_intro_window_macroregion_africa#!"
 com_intro_window_macroregion_oceania: "#todo com_intro_window_macroregion_oceania#!"

