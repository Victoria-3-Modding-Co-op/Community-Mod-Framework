 com_intro_window_subregion_western_europe: "$com_lb$#todo com_intro_window_subregion_western_europe#!"
 com_intro_window_subregion_eastern_europe: "$com_lb$#todo com_intro_window_subregion_eastern_europe#!"
 com_intro_window_subregion_balkans: "$com_lb$#todo com_intro_window_subregion_balkans#!"
 com_intro_window_subregion_east_asia: "$com_lb$#todo com_intro_window_subregion_east_asia#!"

 com_intro_window_rank_header: "[GetPlayer.GetRank.GetNameNoFormatting]"
 com_intro_window_rank_body: "[GetPlayer.GetCustom('com_intro_window_rank_body')]"
 com_intro_window_rank_great_power: "$com_lb$As a [concept_great_power], [GetPlayer.GetNameNoFlag] enjoys a position of dominance in the world order. Locked in an endless competition with her peers, the state seeks to extract the most from weaker countries while guarding themselves against upstart wary [Concept('concept_major_power','$concept_major_powers|q$')] trying to ascend to greatness at their expense."
 com_intro_window_rank_major_minor: "$com_lb$As a [concept_major_power], [GetPlayer.GetNameNoFlag] is recognized as an essential actor in its [concept_strategic_region] and outsiders seeking greater involvement in the region must deal with her in some way. While not yet strong enough to project power on a global scale, the [Concept('concept_great_power','$concept_great_powers|q$')] watch her with cautious eyes."
 com_intro_window_rank_minor_insigificant_power: "$com_lb$As a [GetPlayer.GetRank], [GetPlayer.GetNameNoFlag] is little more than a pawn in the political machinations of the [Concept('concept_major_power','$concept_major_powers|q$')] and [Concept('concept_great_power','$concept_great_powers|q$')]. With little ability to enforce their her abroad, the states struggled for the right to self-determination while trying not to appear too inconvenient to foreign empires."
 com_intro_window_rank_unrecognized: "$com_lb$As an [concept_unrecognized_power], [GetPlayer.GetNameNoFlag] is perceived as inferior and uncivilized by the reigning [Concept('concept_great_power','$concept_great_powers|q$')], who regard them as little more than potential future conquests. With most diplomatic avenues closed to her, the country must seek [Concept('concept_recognized_power','$concept_recognition|q$')] lest she fall to imperialist designs."
 com_intro_window_rank_decentralized: "$com_lb$#red #bold As a [concept_decentralized_nation], [GetPlayer.GetNameNoFlag] should not be seeing this event. Ping Alexedishi on the Victoria 3 Modding Co-op if you see this.#!#!"
 
 com_intro_window_government_summary: "$com_lb$As a [GetPlayer.GetGovernment.GetName], [GetPlayer.GetNameNoFlag] vests its political authority in the [GetPlayer.GetRuler.GetPrimaryRoleTitle] with a [GetPlayer.GetGovernment.GetTransferOfPowerName] [concept_transfer_of_power]."

