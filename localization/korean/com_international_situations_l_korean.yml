 concept_com_situation_leader_desc: "One [concept_country] on each side of a [Concept('concept_com_situation_faction','$concept_com_faction$')] is considered the $concept_com_situation_leader$ for that $concept_com_faction$. These are usually (but not always) the instigators of the $com_situation$, and tend to be the drivers of progress through the $concept_com_situation$ towards its eventual resolution."
