 com_intro_window_macroregion_europe: "유럽은 현재 다양한 경제적·사회적 변혁의 한가운데에 놓여 있습니다. 증기력을 이용한 생산 방식의 확산, 야금 기술의 발전, 기계화의 진전은 산업에 혁명적인 변화를 가져왔습니다. 한편 농민들이 대대로 살아온 고향 마을을 떠나 도시로 몰려들면서, 사회는 폭발적인 인구 증가와 새로운 계급의식의 대두라는 변화에 직면하고 있습니다."
 com_intro_window_macroregion_americas: "아메리카 대륙은 급격한 변혁을 겪고 있습니다. 급부상하는 미국의 영향력이 확대되면서 신대륙의 식민 제국들은 붕괴했으며, 자치권을 점차 확대해 나가는 캐나다와 카리브해 일대의 소규모 영토들만이 유럽 열강의 직접적인 지배가 남아 있는 마지막 거점이 되었습니다. 새롭게 탄생한 국가들은 자신들의 국가적 정체성을 확립하는 동시에, 신생 국가들에 협력할 의사가 거의 없는 수많은 아메리카 원주민들을 어떻게 대우해야 할 것인가라는 문제에 직면해 있습니다."
 com_intro_window_macroregion_mena: "중동과 마그레브 지역은 갈수록 혼란에 빠져들고 있습니다. 오스만 제국의 지속적인 침체로 지중해 전역에 권력의 공백이 발생하고 있으며, 이란의 수호령은 러시아의 팽창으로 인한 압박에 시달리고 있습니다. 동방 문제와 그레이트 게임이 유럽 열강의 주요 관심사로 떠오르면서, 열강들은 서아시아를 자신들의 팽창하는 제국에 종속된 식민지 거점으로 전락시키려 하고 있습니다."
 com_intro_window_macroregion_asia: "동아시아는 점차 짙어지는 유럽 제국주의의 그림자 아래 놓여 있습니다. 오랫동안 동방의 패권국으로 군림해 온 청나라는 유럽 열강의 간섭과 도전에 직면하고 있습니다. 일본은 여전히 외부 세계에 문호를 닫고 있으며, 인도 아대륙과 인도네시아 제도는 이미 식민 열강들에 의해 분할되었습니다. 한편 중앙아시아에서는 러시아와 대영제국이 패권을 놓고 경쟁하면서 그레이트 게임이 기존의 세력 균형을 뒤흔들고 있습니다."
