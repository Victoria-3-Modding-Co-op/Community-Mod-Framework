 com_intro_window_rank_great_power: "$com_lb$[concept_great_power]인 [GetPlayer.GetNameNoFlag]은 세계 질서에서 지배적인 지위를 누리고 있습니다. 다른 열강들과 끊임없이 경쟁하는 가운데, 국가는 약소국으로부터 최대한의 이익을 얻어내는 동시에 자신들을 희생양 삼아 강대국의 반열에 오르려는 신흥 [Concept('concept_major_power','$concept_major_powers|q$')]을 경계하고 견제하고자 합니다."
 com_intro_window_rank_major_minor: "$com_lb$[concept_major_power]인 [GetPlayer.GetNameNoFlag]은 자국이 속한 [concept_strategic_region]에서 핵심적인 행위자로 인정받고 있으며, 이 지역에 대한 영향력을 확대하려는 외부 세력은 어떤 식으로든 이 국가를 상대해야 합니다. 아직 세계적인 규모로 국력을 투사할 만큼 강하지는 않지만, [Concept('concept_great_power','$concept_great_powers|q$')]은 이 국가의 행보를 경계 어린 시선으로 주시하고 있습니다."
 com_intro_window_rank_minor_insigificant_power: "$com_lb$[GetPlayer.GetRank]인 [GetPlayer.GetNameNoFlag]은 [Concept('concept_major_power','$concept_major_powers|q$')]과 [Concept('concept_great_power','$concept_great_powers|q$')]의 정치적 권모술수에 휘둘리는 졸에 불과합니다. 국외에서 자국의 의사를 관철할 능력이 부족한 이 국가는 외국 제국들의 눈에 지나치게 거슬리는 존재로 비치지 않으려 애쓰면서도, 스스로의 운명을 결정할 자결권을 확보하기 위해 고군분투하고 있습니다."
 com_intro_window_rank_unrecognized: "$com_lb$[concept_unrecognized_power]인 [GetPlayer.GetNameNoFlag]은 세계 질서를 주도하는 [Concept('concept_great_power','$concept_great_powers|q$')]으로부터 열등하고 미개한 국가로 여겨지며, 이들에게 장차 정복할 수 있는 잠재적 대상에 불과한 존재로 취급받고 있습니다. 대부분의 외교적 수단이 차단된 상황에서, 이 국가는 제국주의 열강의 야욕에 희생되지 않기 위해 [Concept('concept_recognized_power','$concept_recognition|q$')]을 획득해야 합니다."
 com_intro_window_rank_decentralized: "$com_lb$#red #bold [concept_decentralized_nation]인 [GetPlayer.GetNameNoFlag]에는 이 이벤트가 표시되어서는 안 됩니다. 이 이벤트가 표시된다면 Victoria 3 Modding Co-op에서 Alexedishi를 호출하여 알려주십시오.#!#!"
 com_intro_window_government_summary: "$com_lb$[GetPlayer.GetGovernment.GetName]인 [GetPlayer.GetNameNoFlag]은 [GetPlayer.GetGovernment.GetTransferOfPowerName] [concept_transfer_of_power] 방식에 따라 [GetPlayer.GetRuler.GetPrimaryRoleTitle]에게 정치적 권한을 부여합니다."
