 concept_com_situation_factions_neutral: "Neutral $concept_com_situation_factions$"
 concept_com_faction_neutral: "Neutral $concept_com_faction$"
 concept_com_factions_neutral: "Neutral $concept_com_factions$"
 concept_com_situation_countries: "Involved countries"
 concept_com_situation_faction_neutral_desc: "$concept_com_situation_factions_neutral$ may be either a defined group with a third aim or simply a descriptive term for countries involved in or affected by the $com_situation$. $concept_com_factions_neutral$ are [Concept('concept_country','$concept_countries$')] loosely involved in a situation, but they may be swayed to join a side in the right circumstances."

