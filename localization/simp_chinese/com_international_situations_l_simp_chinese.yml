 concept_com_leader: "Leader"
 concept_com_leaders: "Leaders"
 concept_com_situation_leader_desc: "One [concept_country] on each side of a [Concept('concept_com_situation_faction','$concept_com_faction$')] is considered the $concept_com_situation_leader$ for that $concept_com_faction$. These are usually (but not always) the instigators of the $com_situation$, and tend to be the drivers of progress through the $concept_com_situation$ towards its eventual resolution."
 concept_com_situation_faction: "Situation Faction"
 concept_com_situation_factions: "Situation Factions"
 concept_com_faction: "Faction"
 concept_com_factions: "Factions"
 concept_com_situation_faction_desc: "$concept_com_situation_factions$ are [Concept('concept_country','$concept_countries$')] that share a common interest in the outome of a $com_situation$. They are guided (directly or indirectly) by their [Concept('concept_com_situation_leader','$concept_com_situation_leaders$')] and can either benefit or suffer from its eventual resolution."
 error_no_situation_scope: "CMF: No com_situation scope defined"
 error_situation_side_exists: "CMF: The specified side already exists"
 error_situation_side_not_exists: "CMF: The specified side does not exist"
